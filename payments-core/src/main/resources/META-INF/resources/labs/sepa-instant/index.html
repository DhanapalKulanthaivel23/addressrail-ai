<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AddressRail AI Instant Lab</title><style>body{font:14px Arial;background:#f5f0e8;color:#292521;max-width:1000px;margin:auto;padding:25px}header{background:#252321;color:white;padding:28px}main{display:grid;grid-template-columns:270px 1fr;gap:20px;margin-top:20px}section{background:#fffefa;padding:22px;border:1px solid #d3c7ba}label{display:block;margin:15px 0 6px}select,button{padding:12px;width:100%}button{margin-top:20px;background:#b5ddf1;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow:auto}.event{border-left:3px solid #95603b;background:#f6efe7;padding:12px;margin:10px 0}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header><h1>SEPA Instant · RT1 / TIPS</h1><p>Synthetic educational lab. No actual messages or settlement. Unknown outcomes require reconciliation.</p></header><main><section><label for="rail">Route</label><select id="rail"><option>RT1</option><option>TIPS</option></select><label for="scenario">Case</label><select id="scenario"><option value="confirmed">Fictional positive completion</option><option value="unreachable">Receiving PSP unavailable</option><option value="timeout">Unknown outcome / timeout</option><option value="local-reject">Local rejection</option></select><button id="run">Run teaching simulation</button><p id="state" role="status"></p></section><section><h2 id="title">Payment evidence</h2><div id="events"></div><h3>Read-only investigation view</h3><pre id="detail"></pre></section></main><p>RT1 and TIPS are distinct infrastructures. A fictional completed event is not a real settlement confirmation.</p><script type="module" src="./instant.js"></script></body></html>
