# Standalone local API; not connected to GitHub Pages, Cloudflare, Gemini or Render.
quarkus.http.port=8081
quarkus.http.host=127.0.0.1
quarkus.http.cors=false
# Durable local development store, separate from all existing services.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./addressrail-payments;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=update
# PostgreSQL option for explicitly configured future deployment (no remote DB provisioned).
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${PAYMENTS_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/addressrail}
%prod.quarkus.datasource.username=${PAYMENTS_DB_USER:addressrail}
%prod.quarkus.datasource.password=${PAYMENTS_DB_PASSWORD:}
%prod.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:payments-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Synthetic learning-only POST is available for local development and tests only.
# Production remains disabled; no CORS, remote access or external integrations added.
addressrail.lab.sepa-sct.enabled=false
%dev.addressrail.lab.sepa-sct.enabled=true
%test.addressrail.lab.sepa-sct.enabled=true
%prod.addressrail.lab.sepa-sct.enabled=false

# SCT Inst RT1/TIPS synthetic simulator: dev/test only, never enabled for production.
addressrail.lab.sepa-instant.enabled=false
%dev.addressrail.lab.sepa-instant.enabled=true
%test.addressrail.lab.sepa-instant.enabled=true
%prod.addressrail.lab.sepa-instant.enabled=false

# Local-only CHAPS / RTGS synthetic investigation. Never enabled in production.
addressrail.lab.chaps.enabled=false
%dev.addressrail.lab.chaps.enabled=true
%test.addressrail.lab.chaps.enabled=true
%prod.addressrail.lab.chaps.enabled=false

# Read-only synthetic case catalogue for the local unified investigation UI.
addressrail.lab.catalogue.enabled=false
%dev.addressrail.lab.catalogue.enabled=true
%test.addressrail.lab.catalogue.enabled=true
%prod.addressrail.lab.catalogue.enabled=false
