# Standalone local API; not connected to GitHub Pages, Cloudflare, Gemini or Render.
quarkus.http.port=8081
quarkus.http.host=127.0.0.1
quarkus.http.cors=false
# Durable local development store, separate from all existing services.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./addressrail-payments;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=update
# PostgreSQL option for explicitly configured future deployment (no remote DB provisioned).
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${PAYMENTS_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/addressrail}
%prod.quarkus.datasource.username=${PAYMENTS_DB_USER:addressrail}
%prod.quarkus.datasource.password=${PAYMENTS_DB_PASSWORD:}
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:payments-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
