name: Check AddressRail AI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m backend.evaluate_workbench --output /tmp/workbench-ai-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-ai-offline-evaluation
          path: /tmp/workbench-ai-evaluation.json
          retention-days: 7
      - run: node --check web/app.js
      - run: node --check web/analytics.js
      - run: node --check web/comments.js
      - run: node --check analytics/worker.js
      - run: npm ci
      - run: node --test tests/*.test.mjs

