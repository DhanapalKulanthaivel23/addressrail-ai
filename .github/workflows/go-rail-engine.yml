name: Go rail engine tests
on:
  push:
    paths:
      - 'rail-engine/**'
      - '.github/workflows/go-rail-engine.yml'
  pull_request:
    paths:
      - 'rail-engine/**'
      - '.github/workflows/go-rail-engine.yml'
permissions:
  contents: read
jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rail-engine/go.mod
          cache-dependency-path: rail-engine/go.mod
      - name: Verify Go source is gofmt-clean
        working-directory: rail-engine
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Go vet
        working-directory: rail-engine
        run: go vet ./...
      - name: Test with race detector
        working-directory: rail-engine
        run: go test -race -count=1 ./...
      - name: Benchmark dry-run
        working-directory: rail-engine
        run: go test ./internal/rails -run '^$' -bench '^Benchmark' -benchtime=50x
      - name: HTTP contract — local binding
        working-directory: rail-engine
        run: |
          go build -o /tmp/addressrail-raild ./cmd/raild
          /tmp/addressrail-raild >/tmp/addressrail-go.log 2>&1 &
          echo $! >/tmp/addressrail-go.pid
          trap 'kill $(cat /tmp/addressrail-go.pid)' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8094/healthz | grep -q 'synthetic-only'; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8094/healthz | grep -q 'addressrail-go-educational'
      - name: Start two separate local scheme-profile services and reject cross-rail requests
        working-directory: rail-engine
        run: |
          RAIL_ENGINE_RAIL=CBPR RAIL_ENGINE_PORT=8110 /tmp/addressrail-raild > /tmp/rail-cbpr.log 2>&1 &
          p1=$!
          RAIL_ENGINE_RAIL=CHAPS RAIL_ENGINE_PORT=8111 /tmp/addressrail-raild > /tmp/rail-chaps.log 2>&1 &
          p2=$!
          trap 'kill "$p1" "$p2" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8110/healthz | grep -q 'CBPR' && curl -fsS http://127.0.0.1:8111/healthz | grep -q 'CHAPS'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8110/healthz | grep -q '"railProfile":"CBPR"'
          curl -fsS http://127.0.0.1:8111/healthz | grep -q '"railProfile":"CHAPS"'
          status=$(curl -sS -o /tmp/wrong-rail.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -X POST \
            http://127.0.0.1:8110/v1/validate \
            -d '{"synthetic":true,"rail":"CHAPS","messageType":"pacs.008","currency":"GBP","amount":"1.00","reference":"AR-DEMO-CHAPS"}')
          test "$status" = "422"
          grep -q 'different' /tmp/wrong-rail.json
