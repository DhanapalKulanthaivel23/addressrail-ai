name: Check Banking Studio
on:
  push:
    paths:
      - 'web/studio/**'
      - 'web/index.html'
      - 'tests/studio.test.mjs'
      - 'tests/sepa-sct.test.mjs'
      - 'tests/chaps.test.mjs'
      - 'tests/open-demo.test.mjs'
      - '.github/workflows/studio.yml'
  pull_request:
    paths:
      - 'web/studio/**'
      - 'web/index.html'
      - 'tests/studio.test.mjs'
      - 'tests/sepa-sct.test.mjs'
      - 'tests/chaps.test.mjs'
      - 'tests/open-demo.test.mjs'
      - '.github/workflows/studio.yml'
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/studio/studio.js
      - run: node --check web/studio/sepa-sct/core.mjs
      - run: node --check web/studio/sepa-sct/lab.mjs
      - run: node --check web/studio/chaps/core.mjs
      - run: node --check web/studio/chaps/lab.mjs
      - run: node --check web/studio/open-demo/core.mjs
      - run: node --check web/studio/open-demo/lab.mjs
      - run: node --test tests/studio.test.mjs tests/sepa-sct.test.mjs tests/chaps.test.mjs tests/open-demo.test.mjs
