name: Check Investigation Agent
on:
  push:
    paths:
      - 'ai-agents/**'
      - 'schemas/iso20022/**'
      - '.github/workflows/investigation.yml'
  pull_request:
    paths:
      - 'ai-agents/**'
      - 'schemas/iso20022/**'
      - '.github/workflows/investigation.yml'
permissions:
  contents: read
jobs:
  investigation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-agents/investigation/requirements.txt
      - run: pip install -r ai-agents/investigation/requirements.txt
      - run: PYTHONPATH=ai-agents python -m pytest -q ai-agents/investigation/tests
      - name: Evaluate all synthetic RAG retrieval questions offline
        run: PYTHONPATH=ai-agents python -m investigation.eval_harness
