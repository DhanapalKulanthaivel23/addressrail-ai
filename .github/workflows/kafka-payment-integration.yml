name: Kafka synthetic payments end-to-end
on:
  push:
    paths:
      - 'ai-agents/investigation/**'
      - 'rail-engine/**'
      - 'payments-core/**'
      - 'deploy/compose.kafka.yml'
      - 'examples/kafka/**'
      - '.github/workflows/kafka-payment-integration.yml'
  pull_request:
    paths:
      - 'ai-agents/investigation/**'
      - 'rail-engine/**'
      - 'payments-core/**'
      - 'deploy/compose.kafka.yml'
      - '.github/workflows/kafka-payment-integration.yml'
permissions:
  contents: read
jobs:
  kafka-e2e-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      ADDRESSRAIL_LIVE_KAFKA_TEST: 'true'
      COPILOT_ENABLE_API: 'true'
      ADDRESSRAIL_ENABLE_KAFKA_PIPELINE: 'true'
      COPILOT_API_TOKEN: 'CI-LOCAL-ONLY-TRAINING-TOKEN-NEVER-PROD-123456789'
      COPILOT_REQUIRE_GO: 'true'
      INVESTIGATION_ENABLE_GEMINI: 'false'
      PIPELINE_DB_PATH: '/tmp/addressrail-kafka-ci.sqlite3'
      PAYMENTS_CORE_URL: 'http://127.0.0.1:8081'
      GO_RULES_URL: 'http://127.0.0.1:8094'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rail-engine/go.mod
          cache-dependency-path: rail-engine/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: payments-core/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-agents/investigation/requirements.txt
      - run: pip install -r ai-agents/investigation/requirements.txt
      - name: Start local Kafka broker (KRaft)
        run: docker compose -f deploy/compose.kafka.yml up -d
      - name: Initialise five real Kafka topics
        run: |
          for i in $(seq 1 50); do
            if PYTHONPATH=ai-agents python -m investigation.kafka_workers topics > /tmp/kafka-topics.log 2>&1; then break; fi
            sleep 3
          done
          cat /tmp/kafka-topics.log
          grep -q 'addressrail.payments.submitted.v1' /tmp/kafka-topics.log
      - name: Start localhost Go streaming ISO validator
        run: |
          (cd rail-engine && go run ./cmd/raild) > /tmp/addressrail-go.log 2>&1 &
          echo $! > /tmp/go.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8094/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8094/healthz | grep -q 'synthetic-only'
      - name: Start localhost Java Quarkus payment core (local H2)
        run: |
          (cd payments-core && mvn --batch-mode --no-transfer-progress quarkus:dev -Ddebug=false) > /tmp/addressrail-java.log 2>&1 &
          echo $! > /tmp/java.pid
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8081/api/v1/payments/PAY-10001 >/tmp/java-payment.json 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q 'PAY-10001' /tmp/java-payment.json || { tail -80 /tmp/addressrail-java.log; exit 1; }
      - name: Test Kafka with real Go+Java and Python stages through authenticated API
        env:
          PYTHONPATH: ai-agents
        run: |
          python -m pytest -q ai-agents/investigation/tests/test_kafka_live.py
      - name: Upload fictional end-to-end investigation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-kafka-investigation-report
          path: /tmp/addressrail-kafka-e2e-report.json
          retention-days: 7
      - name: Output targeted logs if failed
        if: failure()
        run: |
          tail -100 /tmp/addressrail-java.log || true
          tail -100 /tmp/addressrail-go.log || true
          docker compose -f deploy/compose.kafka.yml logs --tail=60 || true
      - name: Stop local services
        if: always()
        run: |
          test -f /tmp/java.pid && kill $(cat /tmp/java.pid) || true
          test -f /tmp/go.pid && kill $(cat /tmp/go.pid) || true
          docker compose -f deploy/compose.kafka.yml down || true
