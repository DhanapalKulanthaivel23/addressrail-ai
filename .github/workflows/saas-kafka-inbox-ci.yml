name: SaaS real Kafka to PostgreSQL inbox
on:
  pull_request:
    paths:
      - 'saas/**'
      - '.github/workflows/saas-kafka-inbox-ci.yml'
  push:
    paths:
      - 'saas/**'
      - '.github/workflows/saas-kafka-inbox-ci.yml'
permissions:
  contents: read
jobs:
  real-kafka-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only-password
          POSTGRES_DB: addressrail_test
        options: >-
          --health-cmd "pg_isready -U postgres -d addressrail_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    env:
      SAAS_TEST_ADMIN_DSN: postgresql://postgres:ci-local-only-password@127.0.0.1:5432/addressrail_test
      SAAS_DATABASE_URL: postgresql://addressrail_api:test-only-password-for-ci@127.0.0.1:5432/addressrail_test
      SAAS_TEST_KAFKA_BOOTSTRAP: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r saas/requirements.txt 'confluent-kafka>=2.5,<3'
      - name: Wait for Kafka broker
        run: |
          python - <<'PY'
          import socket,time
          for i in range(60):
              try:
                  with socket.create_connection(('127.0.0.1',9092),timeout=2):
                      break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('Kafka did not start')
          PY
      - run: PYTHONPATH=. python -m pytest -q saas/tests/test_real_kafka_inbox.py
