name: Public AddressRail Feature and Design Evolution
on:
  push:
    paths:
      - 'docs/product_evolution.json'
      - 'docs/PUBLIC_PRODUCT_STATUS.md'
      - 'scripts/check_public_evolution.py'
      - 'tests/test_public_evolution.py'
      - '.github/workflows/public-evolution-policy.yml'
  pull_request:
permissions:
  contents: read
jobs:
  public-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_public_evolution.py' -v
      - run: python scripts/check_public_evolution.py
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_public_evolution.py --base "$BASE_SHA"
